<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Entries - Agent App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* --- DARK THEME UI --- */
    :root { 
      --bg: #121212; 
      --card: #1e1e1e; 
      --primary: #00e676; 
      --secondary: #00bcd4;
      --danger: #ff5252;
      --text: #eee; 
      --border: #333; 
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
    
    /* Nav */
    nav { background: var(--card); padding: 10px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; border: 1px solid var(--border); }
    nav a { color: #aaa; text-decoration: none; padding: 8px 15px; border-radius: 4px; transition: 0.2s; }
    nav a:hover, nav a.active { background: var(--secondary); color: #000; font-weight: bold; }

    /* Header & Total */
    .header-box { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px; }
    .total-display { font-size: 1.2rem; font-weight: bold; color: var(--primary); }

    /* Entry Cards */
    .entries-grid { display: grid; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    
    .entry-card { background: #252525; padding: 15px; border-radius: 8px; border: 1px solid #333; position: relative; }
    .entry-card.approved { border-left: 4px solid var(--primary); }
    .entry-card.pending { border-left: 4px solid #ffab40; }
    .entry-card.rejected { border-left: 4px solid var(--danger); opacity: 0.7; }

    .card-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
    .card-label { color: #aaa; }
    
    .btn-delete { 
      background: #333; color: var(--danger); border: 1px solid #444; 
      padding: 5px 10px; border-radius: 4px; cursor: pointer; float: right; margin-top: 10px; 
    }
    .btn-delete:hover { background: var(--danger); color: white; }

    .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    .bg-pending { background: #ffab40; color: black; }
    .bg-approved { background: var(--primary); color: black; }

    /* Submit Button */
    .fab-btn {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--secondary); color: black; font-weight: bold;
      padding: 15px 25px; border-radius: 30px; border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer;
      display: flex; align-items: center; gap: 10px;
    }
    .fab-btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Dashboard</a>
    <a href="agent_entry.html">Add Collection</a>
    <a href="agent_view.html" class="active">View Entries</a>
  </nav>

  <div class="header-box">
    <h2 style="margin:0;">📝 Today's Logs</h2>
    <div class="total-display" id="totalAmt">₹0</div>
  </div>

  <div id="entriesList" class="entries-grid">
    <p style="text-align:center; width:100%; color:#666;">Loading entries...</p>
  </div>

  <button class="fab-btn" onclick="notifyAdmin()">
    🚀 Submit to Admin
  </button>

  <script type="module">
    import { db } from "./config.js";
    import { 
      collection, query, where, getDocs, deleteDoc, doc, orderBy 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // --- LOAD ENTRIES ---
    async function loadAgentEntries() {
      const listDiv = document.getElementById("entriesList");
      const totalDiv = document.getElementById("totalAmt");
      
      try {
        // Query: Get all 'temp_entries' (You can filter by Agent ID later if needed)
        // Note: In a real app, you might filter by date or agent ID here.
        const q = query(
          collection(db, "temp_entries"),
          orderBy("timestamp", "desc")
        );

        const snapshot = await getDocs(q);
        
        listDiv.innerHTML = "";
        let total = 0;

        if (snapshot.empty) {
          listDiv.innerHTML = `<p style="text-align:center; color:#aaa; grid-column:1/-1;">No pending entries found.</p>`;
          totalDiv.innerText = "₹0";
          return;
        }

        snapshot.forEach(docSnap => {
          const d = docSnap.data();
          const id = docSnap.id;
          
          // Only show today's entries or pending ones? 
          // For now showing all temp entries.
          
          if(d.status === 'pending') total += d.amount;

          const statusBadge = d.status === 'approved' 
            ? `<span class="badge bg-approved">Approved</span>` 
            : `<span class="badge bg-pending">Pending</span>`;

          const deleteBtn = d.status === 'pending' 
            ? `<button class="btn-delete" onclick="window.deleteEntry('${id}')">🗑️ Undo</button>` 
            : ``;

          const html = `
            <div class="entry-card ${d.status}">
              <div class="card-row">
                <span style="color:white; font-weight:bold;">${d.customerName}</span>
                ${statusBadge}
              </div>
              <div class="card-row">
                <span class="card-label">ID: ${d.customerId}</span>
                <span style="color:var(--secondary); font-weight:bold;">₹${d.amount}</span>
              </div>
              <div class="card-row">
                <span class="card-label">Product: ${d.productName}</span>
                <span class="card-label">${d.date}</span>
              </div>
              ${deleteBtn}
            </div>
          `;
          listDiv.innerHTML += html;
        });

        totalDiv.innerText = `Pending: ₹${total}`;

      } catch (e) {
        console.error(e);
        listDiv.innerHTML = `<p style="color:red;">Error loading data.</p>`;
      }
    }

    // --- DELETE ENTRY (Only if pending) ---
    window.deleteEntry = async (docId) => {
      if(!confirm("⚠️ Are you sure you want to remove this entry?")) return;

      try {
        await deleteDoc(doc(db, "temp_entries", docId));
        loadAgentEntries(); // Refresh
      } catch (e) {
        alert("Error deleting: " + e.message);
      }
    };

    // --- NOTIFY ADMIN (Simulation) ---
    window.notifyAdmin = () => {
      // In a more complex app, this could send an email or push notification.
      // For now, it just confirms the agent has checked their list.
      alert("✅ Notification sent to Admin!\n\nThe admin can now go to the 'Approvals' page to merge these entries.");
    };

    // Load on start
    loadAgentEntries();
  </script>
</body>
</html>
