<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reports & Ledger - EMI Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    /* --- PROFESSIONAL DARK THEME --- */
    :root { 
      --bg: #0f172a; 
      --card: #1e293b; 
      --primary: #10b981; 
      --secondary: #06b6d4; 
      --danger: #ef4444; 
      --text: #f1f5f9; 
      --text-muted: #94a3b8;
      --border: #334155; 
    }
    
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }

    /* Navigation */
    nav { 
      background: var(--card); padding: 15px 20px; border-bottom: 1px solid var(--border); 
      display: flex; gap: 10px; overflow-x: auto;
    }
    nav a { 
      color: var(--text-muted); text-decoration: none; padding: 8px 16px; border-radius: 6px; 
      font-size: 0.9rem; white-space: nowrap; transition: 0.2s;
    }
    nav a:hover { background: #2d3748; color: white; }
    nav a.active { background: rgba(6, 182, 212, 0.15); color: var(--secondary); font-weight: 600; }

    /* Main Container */
    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

    /* Controls Section */
    .controls-bar { 
      background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border);
      display: flex; gap: 15px; flex-wrap: wrap; align-items: center; margin-bottom: 30px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .search-wrapper { flex: 2; position: relative; min-width: 300px; }
    .search-wrapper input { 
      width: 100%; padding: 12px 15px; padding-left: 40px; 
      background: #0f172a; border: 1px solid var(--border); border-radius: 8px;
      color: white; font-size: 1rem; box-sizing: border-box;
    }
    .search-wrapper span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    button { 
      padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; 
      display: flex; align-items: center; gap: 8px;
    }
    .btn-load { background: var(--secondary); color: #000; }
    .btn-load:hover { filter: brightness(1.1); }
    .btn-export { background: var(--card); border: 1px solid var(--border); color: var(--text); }
    .btn-export:hover { background: var(--border); }

    /* Stats Overview */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
    .stat-card h3 { margin: 0 0 5px 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-card p { margin: 0; font-size: 1.8rem; font-weight: 700; color: var(--primary); }

    /* Customer Cards */
    .results-area { display: grid; gap: 20px; }
    
    .cust-card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
    .cust-header { 
      background: rgba(255,255,255,0.03); padding: 15px 20px; border-bottom: 1px solid var(--border); 
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
    }
    .cust-info h2 { margin: 0; font-size: 1.1rem; color: white; }
    .cust-info span { color: var(--text-muted); font-size: 0.9rem; }
    .cust-meta { text-align: right; font-size: 0.9rem; color: var(--text-muted); }

    /* Product Table inside Card */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th { text-align: left; padding: 12px 20px; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); }
    td { padding: 12px 20px; border-bottom: 1px solid #334155; color: var(--text); }
    tr:last-child td { border-bottom: none; }
    
    .amount-col { font-family: monospace; font-size: 1rem; }
    .bal-positive { color: var(--danger); font-weight: bold; }
    .bal-zero { color: var(--primary); font-weight: bold; opacity: 0.7; }

    /* Responsive */
    @media (max-width: 768px) {
      .controls-bar { flex-direction: column; align-items: stretch; }
      .cust-header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .cust-meta { text-align: left; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Dashboard</a>
    <a href="customers.html">Customers</a>
    <a href="entries.html">Entries</a>
    <a href="review.html">Review</a>
    <a href="reports.html" class="active">Reports</a>
  </nav>

  <div class="container">
    
    <div class="controls-bar">
      <div class="search-wrapper">
        <span>🔍</span>
        <input id="searchInput" placeholder="Search by Name, ID, or Phone..." onkeyup="handleSearch()">
      </div>
      <button class="btn-load" onclick="loadAllData()">🔄 Load Recent Data</button>
      <button class="btn-export" onclick="exportToCSV()">📤 Export CSV</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Revenue (Visible)</h3>
        <p id="totalPaid">₹0</p>
      </div>
      <div class="stat-card">
        <h3>Total Outstanding (Visible)</h3>
        <p id="totalBal" style="color:var(--danger)">₹0</p>
      </div>
    </div>

    <div id="resultsArea" class="results-area">
      <div style="text-align:center; padding: 50px; color: #666;">
        Click "Load Recent Data" or start typing to search.
      </div>
    </div>

  </div>

  <script type="module">
    import { db } from "./config.js";
    import { collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    let allCustomers = []; // Stores loaded data for fast filtering

    // --- 1. LOAD DATA ---
    window.loadAllData = async () => {
      const btn = document.querySelector(".btn-load");
      const div = document.getElementById("resultsArea");
      
      btn.innerText = "Loading...";
      btn.disabled = true;
      div.innerHTML = `<p style="text-align:center; color:#aaa;">Fetching from Cloud...</p>`;

      try {
        // Load recent 50 customers to save reads (or remove limit for full report)
        const q = query(collection(db, "customers"), orderBy("createdAt", "desc"), limit(50));
        const snapshot = await getDocs(q);
        
        allCustomers = [];
        snapshot.forEach(doc => allCustomers.push(doc.data()));

        renderCustomers(allCustomers);
        btn.innerText = "🔄 Reload Data";

      } catch (e) {
        console.error(e);
        div.innerHTML = `<p style="text-align:center; color:#ef4444;">Error: ${e.message}</p>`;
        btn.innerText = "Error - Retry";
      } finally {
        btn.disabled = false;
      }
    };

    // --- 2. RENDER LOGIC (Correct Math) ---
    function renderCustomers(data) {
      const div = document.getElementById("resultsArea");
      div.innerHTML = "";

      let globalPaid = 0;
      let globalBal = 0;

      if (data.length === 0) {
        div.innerHTML = `<p style="text-align:center; color:#aaa;">No records found.</p>`;
        return;
      }

      data.forEach(c => {
        let rowsHTML = "";
        
        c.products.forEach(p => {
          // --- CRITICAL MATH FIX ---
          const total = parseFloat(p.total || 0);
          
          // Calculate paid sum from payments array
          const paid = (p.payments || []).reduce((sum, pay) => sum + parseFloat(pay.amount || 0), 0);
          
          const balance = total - paid;

          // Global stats accumulator
          globalPaid += paid;
          globalBal += balance;

          // Formatting
          const balClass = balance > 0 ? "bal-positive" : "bal-zero";
          const balText = balance > 0 ? `₹${balance.toLocaleString()}` : "Paid ✔";

          rowsHTML += `
            <tr>
              <td>${p.name}</td>
              <td class="amount-col">₹${total.toLocaleString()}</td>
              <td class="amount-col" style="color:var(--primary)">₹${paid.toLocaleString()}</td>
              <td class="amount-col ${balClass}">${balText}</td>
            </tr>
          `;
        });

        // Create Card HTML
        const card = document.createElement("div");
        card.className = "cust-card";
        card.innerHTML = `
          <div class="cust-header">
            <div class="cust-info">
              <h2>${c.name}</h2>
              <span>ID: ${c.id}</span>
            </div>
            <div class="cust-meta">
              📞 ${c.phone || 'N/A'} <br>
              📍 ${c.place || 'N/A'}
            </div>
          </div>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Product Name</th>
                  <th>Total Cost</th>
                  <th>Total Paid</th>
                  <th>Balance</th>
                </tr>
              </thead>
              <tbody>${rowsHTML}</tbody>
            </table>
          </div>
        `;
        div.appendChild(card);
      });

      // Update Global Stats
      document.getElementById("totalPaid").innerText = "₹" + globalPaid.toLocaleString();
      document.getElementById("totalBal").innerText = "₹" + globalBal.toLocaleString();
    }

    // --- 3. SEARCH FUNCTION (Client Side) ---
    window.handleSearch = () => {
      const term = document.getElementById("searchInput").value.toLowerCase();
      
      if (!term) {
        renderCustomers(allCustomers);
        return;
      }

      const filtered = allCustomers.filter(c => 
        (c.name && c.name.toLowerCase().includes(term)) ||
        (c.id && c.id.toLowerCase().includes(term)) ||
        (c.phone && c.phone.includes(term))
      );

      renderCustomers(filtered);
    };

    // --- 4. EXPORT CSV ---
    window.exportToCSV = () => {
      if (allCustomers.length === 0) return alert("Load data first!");

      let csv = "ID,Name,Phone,Place,Product,Total Cost,Total Paid,Balance\n";

      allCustomers.forEach(c => {
        c.products.forEach(p => {
          const total = parseFloat(p.total || 0);
          const paid = (p.payments || []).reduce((sum, pay) => sum + parseFloat(pay.amount || 0), 0);
          const balance = total - paid;

          csv += `${c.id},${c.name},${c.phone || ''},${c.place || ''},${p.name},${total},${paid},${balance}\n`;
        });
      });

      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Ledger_Report_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    };

    // Auto-load on open? (Optional, currently manual button)
    // loadAllData(); 
  </script>
</body>
</html>
