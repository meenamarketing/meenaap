<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reports - EMI Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* --- MODERN DARK THEME --- */
    :root { 
      --bg: #121212; 
      --card: #1e1e1e; 
      --primary: #00e676; 
      --secondary: #00bcd4;
      --text: #eee; 
      --border: #333; 
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
    
    /* Navigation */
    nav { background: var(--card); padding: 10px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; border: 1px solid var(--border); }
    nav a { color: #aaa; text-decoration: none; padding: 8px 15px; border-radius: 4px; transition: 0.2s; }
    nav a:hover, nav a.active { background: var(--primary); color: #000; font-weight: bold; }

    /* Controls & Filters */
    .controls { background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px; }
    
    input, select { padding: 10px; background: #2c2c2c; border: 1px solid #444; color: white; border-radius: 4px; flex: 1; min-width: 150px; }
    
    button { padding: 10px 20px; background: var(--secondary); color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; transition: 0.2s; }
    button:hover { filter: brightness(0.9); }
    button.load-btn { background: var(--primary); }

    /* Stats Cards */
    .stats-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat-card { flex: 1; background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
    .stat-card h3 { margin: 0 0 5px 0; color: #aaa; font-size: 0.9rem; }
    .stat-card p { margin: 0; font-size: 1.5rem; font-weight: bold; color: var(--primary); }

    /* Tables */
    .table-container { overflow-x: auto; background: var(--card); border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th, td { padding: 12px; border-bottom: 1px solid #333; text-align: left; }
    th { background: #252525; color: var(--primary); }
    tr:hover { background: #2a2a2a; }

    /* Charts */
    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .chart-box { background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--border); height: 300px; display: flex; justify-content: center; }

    @media (max-width: 600px) {
      .controls { flex-direction: column; align-items: stretch; }
      .stats-row { flex-direction: column; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Dashboard</a>
    <a href="customers.html">Customers</a>
    <a href="entries.html">Entries</a>
    <a href="review.html">Agent Sync</a>
    <a href="reports.html" class="active">Reports</a>
  </nav>

  <div class="controls">
    <div style="flex: 100%; margin-bottom: 10px;">
      <strong>📡 Data Source:</strong>
      <span id="dataStatus" style="color:#aaa; margin-left:10px;">Not Loaded</span>
    </div>
    <button class="load-btn" onclick="loadFirebaseData(50)">🔄 Load Recent (50)</button>
    <button class="load-btn" onclick="loadFirebaseData(0)" style="background:#444; color:#fff;">📂 Load ALL Data</button>
    <button onclick="exportCSV()">📤 Export CSV</button>
  </div>

  <div class="controls">
    <input id="searchId" placeholder="🔍 Search ID / Name / Phone" oninput="applyFilters()" />
    <input id="searchPlace" placeholder="📍 Filter by Place" oninput="applyFilters()" />
    <input id="searchProduct" placeholder="📦 Filter by Product" oninput="applyFilters()" />
    <input type="date" id="fromDate" onchange="applyFilters()" />
    <input type="date" id="toDate" onchange="applyFilters()" />
  </div>

  <div class="stats-row">
    <div class="stat-card"><h3>Total Paid (Filtered)</h3><p id="dispTotalPaid">₹0</p></div>
    <div class="stat-card"><h3>Total Balance (Filtered)</h3><p id="dispTotalBal" style="color:var(--secondary)">₹0</p></div>
  </div>

  <div class="charts-grid">
    <div class="chart-box">
      <canvas id="pieChart"></canvas>
    </div>
    <div class="chart-box">
      <canvas id="barChart"></canvas>
    </div>
  </div>

  <h3>📄 Detailed Transactions</h3>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Place</th><th>Product</th>
          <th>Paid</th><th>Due #</th><th>Date</th><th>Type</th>
        </tr>
      </thead>
      <tbody id="reportTable">
        <tr><td colspan="8" style="text-align:center;">Click "Load Recent" to view data.</td></tr>
      </tbody>
    </table>
  </div>

  <script type="module">
    import { db } from "./config.js";
    import { collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    let rawData = []; // Stores all fetched payment rows
    let customersData = []; // Stores raw customer objects
    let pieChartInstance, barChartInstance;

    // --- 1. LOAD DATA FROM FIREBASE ---
    window.loadFirebaseData = async (limitCount) => {
      const btn = document.querySelector(".load-btn");
      const status = document.getElementById("dataStatus");
      
      btn.disabled = true;
      btn.innerText = "Loading...";
      status.innerText = "Fetching from Cloud...";

      try {
        let q;
        if (limitCount > 0) {
          // Optimization: Get only recent customers
          q = query(collection(db, "customers"), orderBy("createdAt", "desc"), limit(limitCount));
        } else {
          // Warning: Reads all documents
          if(!confirm("⚠️ Load ALL data? This will use your read quota.")) {
            btn.disabled = false; btn.innerText = "🔄 Load Recent (50)";
            return;
          }
          q = collection(db, "customers");
        }

        const snapshot = await getDocs(q);
        customersData = [];
        snapshot.forEach(doc => customersData.push(doc.data()));

        processData(customersData);
        status.innerText = `Loaded ${customersData.length} Customers`;

      } catch (e) {
        console.error(e);
        alert("Error loading data: " + e.message);
        status.innerText = "Error!";
      } finally {
        btn.disabled = false;
        btn.innerText = "🔄 Load Recent (50)";
      }
    };

    // --- 2. FLATTEN DATA STRUCTURE ---
    function processData(customers) {
      rawData = [];
      
      customers.forEach(c => {
        c.products.forEach(p => {
          if (Array.isArray(p.payments)) {
            p.payments.forEach(pay => {
              rawData.push({
                id: c.id,
                name: c.name,
                phone: c.phone,
                place: c.place,
                product: p.name,
                paid: pay.amount,
                balance: (p.total - p.paid), // Approx balance logic
                date: pay.date,
                dueNumber: pay.dueNumber,
                type: pay.type || "Installment"
              });
            });
          }
        });
      });

      // Sort by Date Descending
      rawData.sort((a, b) => new Date(b.date) - new Date(a.date));
      applyFilters();
    }

    // --- 3. FILTER LOGIC ---
    window.applyFilters = () => {
      const idTerm = document.getElementById("searchId").value.toLowerCase();
      const placeTerm = document.getElementById("searchPlace").value.toLowerCase();
      const prodTerm = document.getElementById("searchProduct").value.toLowerCase();
      const fromDate = document.getElementById("fromDate").value;
      const toDate = document.getElementById("toDate").value;

      const filtered = rawData.filter(r => {
        const matchesId = !idTerm || r.id.toLowerCase().includes(idTerm) || r.name.toLowerCase().includes(idTerm) || (r.phone && r.phone.includes(idTerm));
        const matchesPlace = !placeTerm || (r.place && r.place.toLowerCase().includes(placeTerm));
        const matchesProd = !prodTerm || r.product.toLowerCase().includes(prodTerm);
        const matchesFrom = !fromDate || r.date >= fromDate;
        const matchesTo = !toDate || r.date <= toDate;

        return matchesId && matchesPlace && matchesProd && matchesFrom && matchesTo;
      });

      renderTable(filtered);
      updateStats(filtered);
    };

    // --- 4. RENDER UI ---
    function renderTable(data) {
      const tbody = document.getElementById("reportTable");
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#aaa;">No records found.</td></tr>`;
        return;
      }

      // Limit table render to 100 rows for performance
      data.slice(0, 100).forEach(r => {
        const row = `
          <tr>
            <td>${r.id}</td>
            <td>${r.name}</td>
            <td>${r.place || '-'}</td>
            <td>${r.product}</td>
            <td style="color:#00e676; font-weight:bold;">₹${r.paid}</td>
            <td>#${r.dueNumber}</td>
            <td>${r.date}</td>
            <td><span style="font-size:0.8em; background:#333; padding:2px 6px; border-radius:4px;">${r.type}</span></td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    }

    function updateStats(data) {
      let totalPaid = 0;
      let totalBalance = 0; // Note: Balance is tricky in flattened lists, doing rough sum
      
      // Calculate Stats
      data.forEach(d => totalPaid += d.paid);

      document.getElementById("dispTotalPaid").innerText = `₹${totalPaid.toLocaleString()}`;
      
      // Chart Logic
      const customerTotals = {};
      data.forEach(r => {
        if(!customerTotals[r.name]) customerTotals[r.name] = 0;
        customerTotals[r.name] += r.paid;
      });

      updateCharts(totalPaid, customerTotals);
    }

    // --- 5. CHARTS ---
    function updateCharts(totalPaid, customerMap) {
      const ctxPie = document.getElementById("pieChart").getContext("2d");
      const ctxBar = document.getElementById("barChart").getContext("2d");

      if (pieChartInstance) pieChartInstance.destroy();
      if (barChartInstance) barChartInstance.destroy();

      // Pie Chart (Just Collection Visual)
      pieChartInstance = new Chart(ctxPie, {
        type: 'doughnut',
        data: {
          labels: ['Filtered Collection', 'Other Target'],
          datasets: [{
            data: [totalPaid, totalPaid * 0.2], // Dummy logic for visual
            backgroundColor: ['#00e676', '#333'],
            borderWidth: 0
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: 'Collection Overview', color:'#eee' } } }
      });

      // Bar Chart (Top 10 Payers)
      const sortedNames = Object.keys(customerMap).sort((a,b) => customerMap[b] - customerMap[a]).slice(0, 10);
      const sortedValues = sortedNames.map(name => customerMap[name]);

      barChartInstance = new Chart(ctxBar, {
        type: 'bar',
        data: {
          labels: sortedNames,
          datasets: [{
            label: 'Paid Amount',
            data: sortedValues,
            backgroundColor: '#00bcd4'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { beginAtZero: true, ticks: { color: '#aaa' } }, x: { ticks: { color: '#aaa' } } },
          plugins: { legend: { display: false }, title: { display: true, text: 'Top 10 Collections (Filtered)', color:'#eee' } }
        }
      });
    }

    // --- 6. EXPORT CSV ---
    window.exportCSV = () => {
      if (rawData.length === 0) return alert("No data loaded to export.");
      
      let csv = "ID,Name,Place,Phone,Product,Paid,Date,DueNumber,Type\n";
      rawData.forEach(row => {
        csv += `${row.id},${row.name},${row.place},${row.phone},${row.product},${row.paid},${row.date},${row.dueNumber},${row.type}\n`;
      });

      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Report_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    };

  </script>
</body>
</html>
