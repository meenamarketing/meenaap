<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customers - EMI Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* --- MODERN DARK THEME --- */
    :root { 
      --bg: #121212; 
      --card: #1e1e1e; 
      --primary: #00e676; 
      --danger: #ff5252;
      --text: #eee; 
      --border: #333; 
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
    
    /* Navigation */
    nav { background: var(--card); padding: 10px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; border: 1px solid var(--border); }
    nav a { color: #aaa; text-decoration: none; padding: 8px 15px; border-radius: 4px; transition: 0.2s; }
    nav a:hover, nav a.active { background: var(--primary); color: #000; font-weight: bold; }

    /* Layout */
    .container { max-width: 1200px; margin: auto; display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media(min-width: 800px) { .container { grid-template-columns: 1fr 2fr; } }

    /* Forms */
    .card-box { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    h2 { color: var(--primary); margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    
    input { width: 100%; padding: 12px; margin-bottom: 10px; background: #2c2c2c; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; transition: 0.2s; }
    input:focus { border-color: var(--primary); outline: none; }
    
    label { font-size: 0.85rem; color: #aaa; margin-bottom: 5px; display: block; }
    
    button { width: 100%; padding: 12px; background: var(--primary); color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; }
    button:hover { filter: brightness(0.9); }
    button.btn-danger { background: var(--danger); color: white; width: auto; padding: 8px 15px; font-size: 0.9rem; }

    /* List / Search */
    .search-bar { display: flex; gap: 10px; margin-bottom: 15px; }
    .customer-list { display: grid; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    
    /* Customer Card UI (Replaces Table) */
    .cust-card { background: #252525; padding: 15px; border-radius: 6px; border-left: 4px solid var(--primary); position: relative; }
    .cust-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .cust-info h3 { margin: 0; color: #fff; font-size: 1.1rem; }
    .cust-info p { margin: 2px 0; font-size: 0.9rem; color: #bbb; }
    
    .prod-badge { background: #333; padding: 5px 10px; border-radius: 4px; font-size: 0.85rem; margin-top: 5px; display: inline-block; border: 1px solid #444; }
    .prod-badge span { color: var(--primary); font-weight: bold; }

    /* Responsive Utilities */
    .hidden { display: none; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Dashboard</a>
    <a href="customers.html" class="active">Customers</a>
    <a href="entries.html">Entries</a>
    <a href="review.html">Agent Sync</a>
  </nav>

  <div class="container">
    
    <div>
      <div class="card-box">
        <h2>➕ Add New Customer</h2>
        <input id="newId" placeholder="Customer ID (Unique)*">
        <input id="newName" placeholder="Full Name*">
        <input id="newPhone" placeholder="Phone Number">
        <input id="newPlace" placeholder="Place / City">
        
        <label>Initial Product</label>
        <input id="newProduct" placeholder="Product Name*">
        <div style="display:flex; gap:10px;">
          <input id="newTotal" type="number" placeholder="Total Price*">
          <input id="newPaid" type="number" placeholder="Down Payment*">
        </div>
        <button id="btnAddCustomer">Create Customer</button>
      </div>

      <div class="card-box">
        <h2>📦 Add Product to Existing</h2>
        <input id="existId" placeholder="Enter Customer ID*">
        <input id="addProduct" placeholder="New Product Name*">
        <div style="display:flex; gap:10px;">
          <input id="addTotal" type="number" placeholder="Total Price*">
          <input id="addPaid" type="number" placeholder="Down Payment*">
        </div>
        <button id="btnAddProduct">Add Product</button>
      </div>
    </div>

    <div>
      <div class="search-bar">
        <input id="searchBox" placeholder="Search by ID..." style="margin-bottom:0;">
        <button onclick="searchData()" style="width: auto; margin-top:0;">🔍</button>
        <button onclick="loadRecent()" style="width: auto; background:#333; color:white; margin-top:0;">🔄</button>
      </div>

      <div id="customerList" class="customer-list">
        <p style="color:#666; text-align:center; width:100%;">Loading recent customers...</p>
      </div>
    </div>

  </div>

  <script type="module">
    import { db } from "./config.js";
    import { 
      doc, setDoc, getDoc, updateDoc, deleteDoc, 
      collection, query, where, limit, getDocs, orderBy, 
      runTransaction, increment 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // --- 1. ADD NEW CUSTOMER ---
    document.getElementById("btnAddCustomer").addEventListener("click", async () => {
      const id = document.getElementById("newId").value.trim();
      const name = document.getElementById("newName").value.trim();
      const product = document.getElementById("newProduct").value.trim();
      const total = parseFloat(document.getElementById("newTotal").value);
      const paid = parseFloat(document.getElementById("newPaid").value);

      if (!id || !name || !product || isNaN(total) || isNaN(paid)) {
        return alert("❌ Please fill all required fields correctly.");
      }

      const btn = document.getElementById("btnAddCustomer");
      btn.innerHTML = "Saving...";
      btn.disabled = true;

      try {
        await runTransaction(db, async (transaction) => {
          const custRef = doc(db, "customers", id);
          const statsRef = doc(db, "metadata", "stats");
          
          const check = await transaction.get(custRef);
          if (check.exists()) throw "Customer ID already exists!";

          // Create Data
          const newCust = {
            id, name, 
            phone: document.getElementById("newPhone").value.trim(),
            place: document.getElementById("newPlace").value.trim(),
            createdAt: new Date().toISOString(),
            products: [{
              name: product,
              total: total,
              paid: paid,
              payments: [{
                date: new Date().toISOString().split("T")[0],
                amount: paid,
                dueNumber: 0, // 0 = Downpayment
                type: "Downpayment"
              }]
            }]
          };

          // Commit Writes
          transaction.set(custRef, newCust);
          
          const bal = total - paid;
          transaction.set(statsRef, {
            totalCustomers: increment(1),
            totalProducts: increment(1),
            totalPaid: increment(paid),
            totalBalance: increment(bal)
          }, { merge: true });
        });

        alert("✅ Customer Created!");
        clearInputs(["newId", "newName", "newPhone", "newPlace", "newProduct", "newTotal", "newPaid"]);
        loadRecent(); // Refresh list

      } catch (e) {
        alert("Error: " + e);
      } finally {
        btn.innerHTML = "Create Customer";
        btn.disabled = false;
      }
    });

    // --- 2. ADD PRODUCT TO EXISTING ---
    document.getElementById("btnAddProduct").addEventListener("click", async () => {
      const id = document.getElementById("existId").value.trim();
      const name = document.getElementById("addProduct").value.trim();
      const total = parseFloat(document.getElementById("addTotal").value);
      const paid = parseFloat(document.getElementById("addPaid").value);

      if (!id || !name || isNaN(total)) return alert("❌ Check inputs");

      try {
        await runTransaction(db, async (transaction) => {
          const custRef = doc(db, "customers", id);
          const statsRef = doc(db, "metadata", "stats");
          
          const docSnap = await transaction.get(custRef);
          if (!docSnap.exists()) throw "Customer not found!";

          const data = docSnap.data();
          const newProd = {
            name, total, paid,
            payments: [{
              date: new Date().toISOString().split("T")[0],
              amount: paid,
              dueNumber: 0,
              type: "Downpayment"
            }]
          };

          data.products.push(newProd);

          transaction.update(custRef, { products: data.products });
          
          const bal = total - paid;
          transaction.update(statsRef, {
            totalProducts: increment(1),
            totalPaid: increment(paid),
            totalBalance: increment(bal)
          });
        });

        alert("✅ Product Added!");
        clearInputs(["existId", "addProduct", "addTotal", "addPaid"]);
        loadRecent();

      } catch (e) {
        alert("Error: " + e);
      }
    });

    // --- 3. LOAD & SEARCH LOGIC ---
    window.loadRecent = async () => {
      const container = document.getElementById("customerList");
      container.innerHTML = `<p style="color:#888;">Fetching recent...</p>`;
      
      try {
        const q = query(collection(db, "customers"), orderBy("createdAt", "desc"), limit(20));
        const snap = await getDocs(q);
        renderList(snap);
      } catch (e) {
        console.error(e);
        container.innerHTML = `<p>Error loading list.</p>`;
      }
    };

    window.searchData = async () => {
      const term = document.getElementById("searchBox").value.trim();
      if (!term) return loadRecent();

      const container = document.getElementById("customerList");
      container.innerHTML = "Searching...";
      
      // Basic Search (Start At)
      const q = query(
        collection(db, "customers"), 
        where("id", ">=", term), 
        where("id", "<=", term + '\uf8ff'),
        limit(10)
      );
      
      const snap = await getDocs(q);
      renderList(snap);
    };

    function renderList(snapshot) {
      const container = document.getElementById("customerList");
      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML = "<p>No customers found.</p>";
        return;
      }

      snapshot.forEach(docSnap => {
        const c = docSnap.data();
        let prodHTML = "";
        
        // Calculate totals for card display
        let totalDebt = 0;
        
        c.products.forEach(p => {
          const bal = p.total - p.paid;
          totalDebt += bal;
          prodHTML += `
            <div class="prod-badge">
              ${p.name} <br>
              Paid: ₹${p.paid} | <span>Bal: ₹${bal}</span>
            </div>
          `;
        });

        const div = document.createElement("div");
        div.className = "cust-card";
        div.innerHTML = `
          <div class="cust-header">
            <div class="cust-info">
              <h3>${c.name} <small style="color:#primary; font-size:0.8em;">(${c.id})</small></h3>
              <p>📞 ${c.phone || '-'}</p>
              <p>📍 ${c.place || '-'}</p>
            </div>
            <button class="btn-danger" onclick="deleteCustomer('${c.id}')">🗑️</button>
          </div>
          <div style="border-top:1px solid #333; padding-top:10px;">
            ${prodHTML}
          </div>
        `;
        container.appendChild(div);
      });
    }

    // --- 4. DELETE CUSTOMER (Smart Delete) ---
    window.deleteCustomer = async (id) => {
      if (!confirm(`⚠️ Are you sure you want to delete ${id}? This cannot be undone and stats will decrease.`)) return;

      try {
        await runTransaction(db, async (transaction) => {
          const custRef = doc(db, "customers", id);
          const statsRef = doc(db, "metadata", "stats");
          
          const snap = await transaction.get(custRef);
          if (!snap.exists()) throw "Customer not found!";
          
          const data = snap.data();
          
          // Calculate what to remove from Global Stats
          let removePaid = 0;
          let removeBal = 0;
          let removeProds = data.products.length;

          data.products.forEach(p => {
            removePaid += p.paid;
            removeBal += (p.total - p.paid);
          });

          // Delete Customer
          transaction.delete(custRef);

          // Decrement Stats
          transaction.update(statsRef, {
            totalCustomers: increment(-1),
            totalProducts: increment(-removeProds),
            totalPaid: increment(-removePaid),
            totalBalance: increment(-removeBal)
          });
        });

        alert("🗑️ Customer Deleted & Stats Updated");
        loadRecent();

      } catch (e) {
        alert("Error deleting: " + e);
      }
    };

    function clearInputs(ids) {
      ids.forEach(id => document.getElementById(id).value = "");
    }

    // Init
    loadRecent();
    
    // Export globally for HTML onclick
    window.searchData = searchData;
    window.loadRecent = loadRecent;
    window.deleteCustomer = deleteCustomer;

  </script>
</body>
</html>
