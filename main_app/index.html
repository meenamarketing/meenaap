<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - EMI Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* --- MODERN DARK THEME --- */
    :root { 
      --bg: #121212; 
      --card: #1e1e1e; 
      --primary: #00e676; 
      --secondary: #00bcd4;
      --danger: #ff5252;
      --text: #eee; 
      --border: #333; 
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
    
    /* Navigation */
    nav { background: var(--card); padding: 10px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; border: 1px solid var(--border); }
    nav a { color: #aaa; text-decoration: none; padding: 8px 15px; border-radius: 4px; transition: 0.2s; }
    nav a:hover, nav a.active { background: var(--primary); color: #000; font-weight: bold; }

    /* Layout */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { margin: 0; color: var(--primary); font-size: 1.5rem; }
    
    .refresh-btn { 
      background: #333; color: white; border: 1px solid #555; 
      padding: 8px 15px; border-radius: 5px; cursor: pointer; transition: 0.2s; 
    }
    .refresh-btn:hover { background: var(--primary); color: black; border-color: var(--primary); }

    /* Stats Grid */
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
    
    .card-stat { 
      background: var(--card); padding: 20px; border-radius: 8px; 
      border: 1px solid var(--border); text-align: center; position: relative; overflow: hidden;
    }
    .card-stat::after { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--secondary); }
    .card-stat:nth-child(1)::after { background: #ab47bc; } /* Customers */
    .card-stat:nth-child(2)::after { background: #29b6f6; } /* Products */
    .card-stat:nth-child(3)::after { background: var(--primary); } /* Paid */
    .card-stat:nth-child(4)::after { background: var(--danger); } /* Balance */

    .card-stat h3 { color: #aaa; font-size: 0.85rem; margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 1px; }
    .card-stat p { font-size: 1.8rem; font-weight: bold; margin: 0; }
    .card-stat small { font-size: 0.8rem; color: #666; }

    /* Chart Section */
    .chart-container { 
      background: var(--card); padding: 20px; border-radius: 8px; 
      border: 1px solid var(--border); max-width: 500px; margin: 0 auto; 
    }
    
    /* Loading State */
    .loading { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="active">Dashboard</a>
    <a href="customers.html">Customers</a>
    <a href="entries.html">Entries</a>
    <a href="review.html">Agent Sync</a>
    <a href="reports.html">Reports</a>
  </nav>

  <div class="header">
    <h1>🔥 Overview</h1>
    <button class="refresh-btn" onclick="loadDashboard()">🔄 Refresh Stats</button>
  </div>

  <div class="summary">
    <div class="card-stat">
      <h3>Customers</h3>
      <p id="totalCustomers">-</p>
      <small>Active Profiles</small>
    </div>
    <div class="card-stat">
      <h3>Products</h3>
      <p id="totalProducts">-</p>
      <small>Sold Units</small>
    </div>
    <div class="card-stat">
      <h3>Collected</h3>
      <p id="totalPaid" style="color:var(--primary)">-</p>
      <small>Total Revenue</small>
    </div>
    <div class="card-stat">
      <h3>Outstanding</h3>
      <p id="totalBalance" style="color:var(--danger)">-</p>
      <small>Pending Dues</small>
    </div>
  </div>

  <div class="chart-container">
    <canvas id="mainChart"></canvas>
  </div>

  <script type="module">
    import { db } from "./config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    let chartInstance = null;

    // --- LOAD DASHBOARD ---
    window.loadDashboard = async () => {
      const btn = document.querySelector(".refresh-btn");
      btn.classList.add("loading");
      btn.innerText = "Loading...";

      try {
        // Reads only ONE document for all stats (Super Cheap)
        const docRef = doc(db, "metadata", "stats");
        const snap = await getDoc(docRef);

        let data = { totalCustomers: 0, totalProducts: 0, totalPaid: 0, totalBalance: 0 };
        
        if (snap.exists()) {
          data = snap.data();
        } else {
          console.log("Stats document not created yet. Add a customer to initialize.");
        }

        // Update UI
        animateValue("totalCustomers", data.totalCustomers || 0);
        animateValue("totalProducts", data.totalProducts || 0);
        document.getElementById("totalPaid").innerText = "₹" + (data.totalPaid || 0).toLocaleString();
        document.getElementById("totalBalance").innerText = "₹" + (data.totalBalance || 0).toLocaleString();

        renderChart(data.totalPaid || 0, data.totalBalance || 0);
      
      } catch (error) {
        console.error("Dashboard Error:", error);
        alert("Error loading stats. Check console.");
      } finally {
        btn.classList.remove("loading");
        btn.innerText = "🔄 Refresh Stats";
      }
    };

    // --- CHART RENDER ---
    function renderChart(paid, balance) {
      const ctx = document.getElementById("mainChart").getContext('2d');
      
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Collected Amount', 'Outstanding Balance'],
          datasets: [{
            data: [paid, balance],
            backgroundColor: ['#00e676', '#ff5252'],
            borderColor: '#1e1e1e',
            borderWidth: 5,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          cutout: '70%',
          plugins: {
            legend: { position: 'bottom', labels: { color: '#aaa', padding: 20 } },
            title: { display: true, text: 'Collection Status', color: '#eee', font: { size: 16 } }
          }
        }
      });
    }

    // --- ANIMATION HELPER ---
    function animateValue(id, end) {
      const obj = document.getElementById(id);
      obj.innerText = end; // Simple set for now
    }

    // Initialize
    loadDashboard();
  </script>
</body>
</html>
