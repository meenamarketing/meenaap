<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Entries - EMI Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* --- MODERN DARK THEME --- */
    :root { 
      --bg: #121212; 
      --card: #1e1e1e; 
      --primary: #00e676; 
      --secondary: #00bcd4;
      --text: #eee; 
      --border: #333; 
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
    
    /* Navigation */
    nav { background: var(--card); padding: 10px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; border: 1px solid var(--border); }
    nav a { color: #aaa; text-decoration: none; padding: 8px 15px; border-radius: 4px; transition: 0.2s; }
    nav a:hover, nav a.active { background: var(--primary); color: #000; font-weight: bold; }

    /* Search Area */
    .search-container { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; background: #2c2c2c; border: 1px solid #444; color: white; border-radius: 4px; font-size: 1rem; }
    button { padding: 10px 25px; background: var(--secondary); color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; transition: 0.2s; }
    button:hover { filter: brightness(0.9); }
    button.pay-btn { background: var(--primary); width: 100%; margin-top: 10px; }

    /* Result Cards */
    .result-area { display: grid; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    .customer-card { background: var(--card); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
    .card-header { background: #252525; padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .card-header h3 { margin: 0; color: #fff; font-size: 1.1rem; }
    .card-header small { color: #aaa; }
    
    .product-list { padding: 15px; }
    .product-item { background: #1a1a1a; padding: 15px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #333; }
    .prod-title { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: var(--secondary); }
    .stats-row { display: flex; justify-content: space-between; font-size: 0.9rem; color: #bbb; margin-bottom: 15px; }
    
    .input-group { display: flex; gap: 10px; }
    .input-group input { padding: 8px; }

    /* Helper Classes */
    .text-green { color: var(--primary); }
    .text-red { color: #ff5252; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Dashboard</a>
    <a href="customers.html">Customers</a>
    <a href="entries.html" class="active">Entries</a>
    <a href="review.html">Agent Sync</a>
    <a href="reports.html">Reports</a>
  </nav>

  <div class="search-container">
    <input id="searchInput" placeholder="🔍 Enter Customer ID (e.g., C001)..." onkeypress="handleEnter(event)">
    <button onclick="searchCustomer()">Search</button>
  </div>

  <div id="resultArea" class="result-area">
    <div style="grid-column: 1/-1; text-align: center; color: #666; margin-top: 50px;">
      Type a Customer ID above to manage payments.
    </div>
  </div>

  <script type="module">
    import { db } from "./config.js";
    import { 
      collection, query, where, getDocs, doc, runTransaction, increment, limit 
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    // --- 1. SEARCH LOGIC ---
    window.searchCustomer = async () => {
      const term = document.getElementById("searchInput").value.trim();
      const div = document.getElementById("resultArea");
      
      if (term.length < 1) return alert("Please enter an ID");

      div.innerHTML = `<p style="color:#aaa; text-align:center; width:100%;">Searching cloud database...</p>`;

      try {
        // Optimized Search: Range query for 'starts with' + Limit 5
        const q = query(
          collection(db, "customers"),
          where("id", ">=", term),
          where("id", "<=", term + '\uf8ff'),
          limit(5)
        );

        const snapshot = await getDocs(q);
        div.innerHTML = "";

        if (snapshot.empty) {
          div.innerHTML = `<p style="text-align:center; width:100%;">❌ No customer found with ID "${term}"</p>`;
          return;
        }

        snapshot.forEach(docSnap => {
          renderCard(docSnap.data());
        });

      } catch (e) {
        console.error(e);
        div.innerHTML = `<p style="color:red; text-align:center;">Error: ${e.message}</p>`;
      }
    };

    window.handleEnter = (e) => {
      if(e.key === "Enter") searchCustomer();
    }

    // --- 2. RENDER CARD UI ---
    function renderCard(c) {
      const div = document.getElementById("resultArea");
      const card = document.createElement("div");
      card.className = "customer-card";

      let productsHtml = "";
      
      c.products.forEach((p, idx) => {
        const balance = p.total - p.paid;
        // Last payment info (optional helper)
        const lastPay = p.payments.length > 0 ? p.payments[p.payments.length - 1] : null;
        const lastPayText = lastPay ? `Last: ₹${lastPay.amount} on ${lastPay.date}` : "No payments yet";

        productsHtml += `
          <div class="product-item">
            <div class="prod-title">
              <span>📦 ${p.name}</span>
              <span class="${balance > 0 ? 'text-red' : 'text-green'}">Bal: ₹${balance}</span>
            </div>
            
            <div class="stats-row">
              <span>Total: ₹${p.total}</span>
              <span>Paid: ₹${p.paid}</span>
            </div>
            <div style="font-size:0.8rem; color:#666; margin-bottom:10px;">${lastPayText}</div>

            <div class="input-group">
              <input type="number" id="amt_${c.id}_${idx}" placeholder="Amount (₹)">
              <input type="date" id="date_${c.id}_${idx}" value="${new Date().toISOString().split('T')[0]}">
            </div>
            <button class="pay-btn" onclick="processPayment('${c.id}', ${idx})">Add Payment</button>
          </div>
        `;
      });

      card.innerHTML = `
        <div class="card-header">
          <div>
            <h3>${c.name}</h3>
            <small>ID: ${c.id}</small>
          </div>
          <div style="text-align:right;">
            <small>📍 ${c.place || '-'}</small><br>
            <small>📞 ${c.phone || '-'}</small>
          </div>
        </div>
        <div class="product-list">${productsHtml}</div>
      `;
      div.appendChild(card);
    }

    // --- 3. PAYMENT TRANSACTION LOGIC ---
    window.processPayment = async (custId, prodIdx) => {
      const amtInput = document.getElementById(`amt_${custId}_${prodIdx}`);
      const dateInput = document.getElementById(`date_${custId}_${prodIdx}`);
      
      const amount = parseFloat(amtInput.value);
      const date = dateInput.value;

      if (!amount || amount <= 0) return alert("❌ Enter a valid positive amount");

      const btn = event.target;
      const originalText = btn.innerText;
      btn.innerText = "Processing...";
      btn.disabled = true;

      try {
        await runTransaction(db, async (transaction) => {
          // 1. Get Refs
          const custRef = doc(db, "customers", custId);
          const statsRef = doc(db, "metadata", "stats");

          // 2. Read
          const custDoc = await transaction.get(custRef);
          if (!custDoc.exists()) throw "Customer does not exist!";

          const data = custDoc.data();
          const product = data.products[prodIdx];

          // 3. Logic
          // Find max due number
          let maxDue = 0;
          if (product.payments && product.payments.length > 0) {
            maxDue = Math.max(...product.payments.map(p => p.dueNumber || 0));
          }

          const newPayment = {
            date: date,
            amount: amount,
            dueNumber: maxDue + 1,
            type: "Manual Entry"
          };

          product.payments.push(newPayment);
          product.paid += amount;

          // 4. Update Customer
          transaction.update(custRef, { products: data.products });

          // 5. Update Global Dashboard Stats (Atomic)
          transaction.update(statsRef, {
            totalPaid: increment(amount),
            totalBalance: increment(-amount)
          });
        });

        alert("✅ Payment Successful!");
        // Refresh the specific card to show new balance
        searchCustomer(); 

      } catch (e) {
        console.error(e);
        alert("Transaction Failed: " + e.message);
        btn.innerText = originalText;
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
